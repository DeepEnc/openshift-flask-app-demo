apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: flask-app-build
spec:
  source:
    type: Git
    git:
      uri: https://github.com/DeepEnc/openshift-flask-app-demo.git
      ref: 0.1-develop
    contextDir: app   
  output:
    to:
      kind: ImageStreamTag
      name: flask-app:latest  
  strategy:
    type: Docker
    dockerStrategy: {}
  triggers:
    - type: GitHub
      github:
        secret: webhook_secret
    - type: ConfigChange
    - type: ImageChange
